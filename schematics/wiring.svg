<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Frost Early-Warning node: ESP32-S3 + 2x DHT22 wiring</title>
  <rect width="820" height="540" fill="#ffffff"/>

  <!-- ESP32-S3 board -->
  <rect x="40" y="40" width="230" height="400" rx="10" fill="#f3f5f8" stroke="#2b2f36" stroke-width="2"/>
  <text x="155" y="70" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b1f24">ESP32-S3-WROOM-1</text>
  <text x="155" y="88" text-anchor="middle" fill="#5d6673">DevKit</text>
  <rect x="20" y="215" width="34" height="50" rx="4" fill="#d9dee5" stroke="#2b2f36"/>
  <text x="62" y="245" fill="#5d6673" font-size="11">USB → PC / 5 V</text>
  <g fill="#1b1f24" text-anchor="end">
    <text x="258" y="94">GPIO6</text>
    <text x="258" y="174">GPIO4</text>
    <text x="258" y="274">GPIO7</text>
    <text x="258" y="354">GPIO5</text>
    <text x="258" y="414">GND</text>
  </g>
  <g fill="#2b2f36">
    <circle cx="270" cy="90" r="4"/><circle cx="270" cy="170" r="4"/><circle cx="270" cy="270" r="4"/>
    <circle cx="270" cy="350" r="4"/><circle cx="270" cy="410" r="4"/>
  </g>

  <!-- DHT22 sensors -->
  <g>
    <rect x="600" y="50" width="170" height="180" rx="8" fill="#ffffff" stroke="#2b2f36" stroke-width="2"/>
    <text x="700" y="128" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b1f24">DHT22 #1</text>
    <text x="700" y="148" text-anchor="middle" fill="#5d6673" font-size="11">AM2302</text>
    <rect x="600" y="250" width="170" height="180" rx="8" fill="#ffffff" stroke="#2b2f36" stroke-width="2"/>
    <text x="700" y="328" text-anchor="middle" font-weight="bold" font-size="15" fill="#1b1f24">DHT22 #2</text>
    <text x="700" y="348" text-anchor="middle" fill="#5d6673" font-size="11">AM2302</text>
    <g fill="#1b1f24" font-size="11">
      <text x="608" y="84">1 VCC</text><text x="608" y="124">2 DATA</text><text x="608" y="164">3 NC</text><text x="608" y="204">4 GND</text>
      <text x="608" y="284">1 VCC</text><text x="608" y="324">2 DATA</text><text x="608" y="364">3 NC</text><text x="608" y="404">4 GND</text>
    </g>
  </g>

  <!-- wires: VCC (switched 3.3 V from GPIO) -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="270,90 430,90 430,80 600,80"/>
    <polyline points="270,270 430,270 430,280 600,280"/>
  </g>
  <!-- wires: DATA -->
  <g fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="270,170 470,170 470,120 600,120"/>
    <polyline points="270,350 470,350 470,320 600,320"/>
  </g>
  <!-- wires: GND -->
  <g fill="none" stroke="#2b2f36" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="270,410 580,410 580,200 600,200"/>
    <polyline points="580,400 600,400"/>
  </g>
  <!-- NC stubs -->
  <g stroke="#9aa4b1" stroke-width="2"><line x1="585" y1="160" x2="600" y2="160"/><line x1="585" y1="360" x2="600" y2="360"/></g>

  <!-- pull-up resistors between VCC and DATA -->
  <g stroke="#2b2f36" stroke-width="2" fill="#ffffff">
    <line x1="540" y1="80" x2="540" y2="120"/>
    <rect x="533" y="88" width="14" height="24"/>
    <line x1="540" y1="280" x2="540" y2="320"/>
    <rect x="533" y="288" width="14" height="24"/>
  </g>
  <g fill="#2b2f36">
    <circle cx="540" cy="80" r="4"/><circle cx="540" cy="120" r="4"/>
    <circle cx="540" cy="280" r="4"/><circle cx="540" cy="320" r="4"/>
    <circle cx="580" cy="400" r="4"/>
  </g>
  <g fill="#1b1f24" font-size="11">
    <text x="527" y="98" text-anchor="end">R1</text><text x="527" y="112" text-anchor="end">4.7 kΩ</text>
    <text x="527" y="298" text-anchor="end">R2</text><text x="527" y="312" text-anchor="end">4.7 kΩ</text>
  </g>

  <!-- legend and notes -->
  <g font-size="12" fill="#1b1f24">
    <line x1="40" y1="472" x2="70" y2="472" stroke="#c0392b" stroke-width="3"/><text x="78" y="476">VCC 3.3 V (switched by GPIO6 / GPIO7)</text>
    <line x1="340" y1="472" x2="370" y2="472" stroke="#1f6feb" stroke-width="3"/><text x="378" y="476">DATA</text>
    <line x1="440" y1="472" x2="470" y2="472" stroke="#2b2f36" stroke-width="3"/><text x="478" y="476">GND</text>
    <circle cx="560" cy="472" r="4" fill="#2b2f36"/><text x="570" y="476">junction (no dot = wires only cross)</text>
  </g>
  <g font-size="11" fill="#5d6673">
    <text x="40" y="500">DHT22 pins counted from the left, grid facing you. A 3-pin DHT22 module already has the pull-up: omit R1/R2.</text>
    <text x="40" y="518">Powering from 3V3 instead of GPIO6/7: wire VCC to 3V3 and set DHT1_POWER_PIN / DHT2_POWER_PIN to -1 in config.h.</text>
  </g>
</svg>
